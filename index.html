<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><title>DO ZERO AO TOPO 0.3</title><style>:root{--bg:#f4f7fb;--c:#fff;--i:#111827;--m:#68758c;--g:#15965b;--b:#2870e8;--l:#e2e7ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}header{background:#101827;color:#fff;padding:46px 22px 32px}h1{font-size:40px;margin:0 0 10px}header p{margin:5px 0;color:#d5dae3;font-size:19px}.v{color:#96a1b4;font-size:14px}main{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.card{background:var(--c);border:1px solid var(--l);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 5px 18px #1720330b}.stat span{color:var(--m);font-size:14px}.stat b{display:block;font-size:24px;margin-top:5px}.ey{color:var(--g);font-weight:800;letter-spacing:2px;font-size:14px}.title{font-size:28px;line-height:1.2;margin:9px 0 14px}.muted{color:var(--m)}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.bar{height:11px;background:#e7ebf1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}button,input,select{font:inherit}button{width:100%;padding:17px;border-radius:18px;border:2px solid #dfe5ed;background:#fff;color:var(--b);font-weight:750;text-align:left;margin-top:9px}button.primary{background:#51b875;color:#fff;border:0;text-align:center}button.dark{background:#eef2f6;color:var(--i);border:0;text-align:center}input,select{width:100%;padding:16px;border:2px solid #dfe5ed;border-radius:17px;background:#fff;margin:7px 0 14px}.choice small{display:block;color:var(--m);font-weight:500;margin-top:5px}.event{font-size:25px;line-height:1.3}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:#f0f3f7;padding:8px 10px;border-radius:13px;font-weight:700;font-size:13px}.big{font-size:38px;font-weight:850;text-align:center}.rank{display:grid;grid-template-columns:45px 1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--l)}footer{text-align:center;color:var(--m);padding:18px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.grid .stat:last-child{grid-column:span 2}h1{font-size:36px}.title{font-size:25px}}</style></head><body><header><h1>DO ZERO AO TOPO</h1><p>Sua vida. Suas escolhas. Seu futuro.</p><div class="v">MVP 0.3 • vida contínua, patrimônio, carreira e decisões</div></header><main id="app"></main><footer>DO ZERO AO TOPO — MVP 0.3</footer><script>
const K='dzat_mvp03';const cities=['São Paulo','Rio de Janeiro','Brasília','Belo Horizonte','Curitiba','Campinas','Salvador','Porto Alegre'];const ev=[
['Uma oportunidade de melhorar sua renda apareceu. O que você faz?',[['📚 Fazer um curso e investir em você',-300,0,0,0,12,0,90,500,0],['💰 Guardar dinheiro para a reserva',250,0,0,0,2,0,65,0,0],['🛍️ Comprar algo que queria',-450,0,0,0,0,0,25,0,4]]],
['Seu primeiro grande objetivo está ficando perto. Qual é a prioridade?',[['🛡️ Montar uma reserva de emergência',350,0,0,0,2,0,80,0,0],['📈 Começar a investir',-250,0,350,0,0,0,100,0,0],['🚗 Comprar um veículo usado',-900,1100,0,0,0,0,55,0,0]]],
['Uma compra grande parece irresistível e está em promoção.',[['🧠 Não comprar e manter o plano',180,0,0,0,0,0,70,0,0],['💳 Parcelar no crédito',-100,1200,0,0,0,0,35,0,0],['💸 Comprar à vista',-850,0,0,850,0,0,45,0,2]]],
['Você pensa em comprar seu primeiro carro. Qual estratégia faz sentido?',[['🚗 Comprar um carro dentro do orçamento',-2200,0,0,2500,0,0,100,0,0],['🏦 Financiar um carro melhor',-800,6500,0,7000,0,0,55,0,0],['📈 Adiar o carro e investir',-500,0,800,0,0,0,120,0,0]]],
['Você juntou dinheiro para pensar no primeiro imóvel.',[['🏠 Continuar juntando entrada',900,0,300,0,0,0,110,0,0],['🏠 Comprar um imóvel menor',-5000,18000,0,24000,0,0,130,0,0],['📊 Investir e esperar melhor oportunidade',-1000,0,1800,0,0,0,115,0,0]]],
['Sua carreira avançou. Você recebeu uma proposta para se especializar.',[['🎓 Aceitar e estudar',-1200,0,0,0,20,0,150,900,0],['💼 Trabalhar mais e estudar depois',800,0,0,0,5,0,95,250,0],['🚀 Abrir uma atividade por conta própria',-1800,0,0,2800,0,12,170,600,0]]],
['Seu negócio está crescendo. Você pode expandir.',[['🏢 Expandir usando caixa',-3500,0,0,6500,0,18,190,0,0],['🏦 Pegar crédito para expandir',-300,8000,0,9000,0,25,140,0,0],['🛡️ Fortalecer a operação',1200,0,0,0,0,0,120,0,0]]],
['Uma crise inesperada atingiu sua renda.',[['🛡️ Usar a reserva',-1200,0,0,0,0,0,110,0,-2],['💳 Fazer dívida para preservar ativos',0,2200,0,0,0,0,70,0,0],['📉 Vender parte dos investimentos',900,0,-1000,0,0,0,90,0,0]]],
['Você recebeu uma herança de R$ 20.000. O que fará?',[['📊 Diversificar e investir',-5000,0,22000,0,0,0,180,0,0],['🏠 Usar como entrada em imóvel',-8000,10000,0,18000,0,0,170,0,0],['✨ Realizar um sonho',-14000,0,0,2500,0,0,80,0,8]]],
['Sua empresa pode contratar e crescer, mas o caixa ficará apertado.',[['👥 Contratar e expandir',-4500,0,0,8000,0,20,210,0,0],['🧠 Automatizar e crescer devagar',-1800,0,0,3000,10,0,175,0,0],['🛑 Não expandir agora',900,0,0,0,0,0,130,0,0]]],
['Você pode se aposentar mais cedo, mas terá de reduzir sua renda.',[['🌅 Aposentar mais cedo',1000,0,0,0,0,0,180,-1200,12],['💼 Continuar trabalhando e investir',1800,0,2500,0,0,0,200,0,0],['🏢 Transformar negócio em renda recorrente',-1500,0,0,5000,0,8,220,700,0]]],
['Uma oportunidade extraordinária pode colocar boa parte do patrimônio em risco.',[['🧠 Investir apenas uma parcela',-2500,0,5000,0,0,0,240,0,0],['🔥 Apostar uma grande parte',-9000,0,18000,0,0,30,300,0,0],['🛡️ Preservar o patrimônio',1200,0,0,0,0,0,180,0,0]]],
['Uma decisão familiar exige dinheiro, tempo e responsabilidade.',[['❤️ Ajudar a família e ajustar o orçamento',-3500,0,0,0,0,0,180,0,15],['⚖️ Ajudar sem comprometer a reserva',-1500,0,0,0,0,0,220,0,8],['📈 Manter o plano e buscar outra solução',300,0,500,0,0,0,190,0,3]]],
['Sua vida chegou a uma fase em que preservar é tão importante quanto crescer.',[['🏛️ Diversificar e proteger',1000,0,2200,0,0,0,260,0,0],['🚀 Riscos calculados',-2500,0,6000,0,0,18,300,0,0],['❤️ Priorizar qualidade de vida',-1200,0,0,0,0,0,250,0,20]]]
];
function def(){return {name:'Jogador',age:18,season:1,day:1,cash:1000,assets:0,invest:0,biz:0,debt:0,income:3800,skill:0,risk:0,life:0,xp:0,seasonXp:0,used:[],profession:'',city:'São Paulo',car:false,house:false,history:[],done:false}}let s;try{s=JSON.parse(localStorage.getItem(K))||def()}catch(e){s=def()}function save(){localStorage.setItem(K,JSON.stringify(s))}function money(x){return 'R$ '+Math.round(x).toLocaleString('pt-BR')}function net(){return s.cash+s.assets+s.invest+s.biz-s.debt}function lvl(){return Math.min(5,Math.floor((s.age-18)/8)+1)}function lname(){return ['','Começo da vida','Construindo carreira','Patrimônio e grandes decisões','Alta responsabilidade','Mestre da vida'][lvl()]}function prep(){let a=[...Array(ev.length).keys()];a.sort(()=>Math.random()-.5);let eligible=a.filter(i=>s.age>=18);s.used=eligible.slice(0,7)}function incomeFor(p){p=p.toLowerCase();if(/méd|medic|doctor|dent/.test(p))return 9000;if(/adv|direito/.test(p))return 6500;if(/engen/.test(p))return 7000;if(/program|dev|tech/.test(p))return 6500;if(/professor|teacher/.test(p))return 3800;if(/mecân/.test(p))return 4200;if(/empres/.test(p))return 6500;return 3500}function start(){s=def();s.name=(document.querySelector('#name').value||'Jogador').trim();s.profession=(document.querySelector('#prof').value||'profissional').trim();s.city=document.querySelector('#city').value;s.income=incomeFor(s.profession);prep();save();render()}function badges(){let a=[];a.push(s.risk>=25?'🔥 Agressivo':s.risk>=10?'⚡ Oportunista':'🛡️ Conservador');if(s.invest>500)a.push('📈 Investidor');if(s.biz>1000)a.push('💼 Empreendedor');if(s.debt>0)a.push('💳 Endividado');if(s.skill>=20)a.push('🎓 Qualificado');if(s.life>=15)a.push('❤️ Vida equilibrada');return a}function renderStart(){app.innerHTML='<div class="card"><div class="ey">NOVA VIDA</div><div class="title">Comece aos 18. Chegue onde suas escolhas levarem.</div><p class="muted">Você começa com R$ 1.000. Sua profissão é livre. Cada temporada representa mais um ano da sua vida e seu patrimônio continua.</p><label>Nome</label><input id="name" placeholder="Ex.: Roni"><label>Profissão</label><input id="prof" placeholder="Ex.: médico, mecânico, advogado, programador"><label>Cidade</label><select id="city">'+cities.map(x=>'<option>'+x+'</option>').join('')+'</select><button class="primary" onclick="start()">🚀 Começar minha vida</button><div class="card" style="margin-top:14px;background:#eef7ff">⚠️ Não existe botão de voltar. Suas escolhas têm consequências.</div></div>'}function render(){if(!s.profession)return renderStart();if(s.done)return finish();let e=ev[s.used[s.day-1]]||ev[0];app.innerHTML='<div class="grid"><div class="stat"><span>Dinheiro</span><b>'+money(s.cash)+'</b></div><div class="stat"><span>Patrimônio líquido</span><b>'+money(net())+'</b></div><div class="stat"><span>XP total</span><b>'+s.xp.toLocaleString('pt-BR')+'</b></div></div><div class="card"><div class="ey">TEMPORADA '+s.season+' • '+lname().toUpperCase()+'</div><div class="title">Dia '+s.day+'/7 • '+s.age+' anos</div><div class="bar"><i style="width:'+((s.day-1)/7*100)+'%"></i></div><p class="muted">'+s.name+' • '+s.profession+' • '+s.city+' • renda '+money(s.income)+'</p><div class="badges">'+badges().map(x=>'<span class="badge">'+x+'</span>').join('')+'</div></div><div class="card"><div class="ey">DECISÃO DE HOJE • NÍVEL '+lvl()+'</div><div class="event">'+e[0]+'</div>'+e[1].map((o,i)=>'<button class="choice" onclick="choose('+i+')"><b>'+o[0]+'</b><small>XP +'+o[7]+'</small></button>').join('')+'</div><div class="card"><div class="ey">SEU PATRIMÔNIO</div><div class="row"><span>💰 Caixa</span><b>'+money(s.cash)+'</b></div><div class="row"><span>🚗🏠 Bens</span><b>'+money(s.assets)+'</b></div><div class="row"><span>📈 Investimentos</span><b>'+money(s.invest)+'</b></div><div class="row"><span>🏢 Negócios</span><b>'+money(s.biz)+'</b></div><div class="row"><span>💳 Dívidas</span><b>'+money(s.debt)+'</b></div><div class="row"><b>Patrimônio líquido</b><b>'+money(net())+'</b></div></div><div class="card"><div class="ey">EVOLUÇÃO</div><div class="row"><span>🎓 Qualificação</span><b>'+s.skill+'</b></div><div class="row"><span>⚡ Risco</span><b>'+s.risk+'</b></div><div class="row"><span>❤️ Qualidade de vida</span><b>'+s.life+'</b></div></div>'}function choose(i){let e=ev[s.used[s.day-1]]||ev[0],o=e[1][i];s.history.push({age:s.age,season:s.season,day:s.day,q:e[0],choice:o[0]});s.cash+=o[1];s.debt+=o[2];s.invest=Math.max(0,s.invest+o[3]);s.assets+=o[4];s.skill+=o[5];s.risk=Math.max(0,s.risk+o[6]);s.seasonXp+=o[7];s.xp+=o[7];s.income=Math.max(800,s.income+o[8]);s.life=Math.max(0,s.life+o[9]);if(o[0].includes('carro'))s.car=true;if(o[0].includes('imóvel'))s.house=true;s.cash+=Math.round(s.income/12);if(s.debt>0)s.debt+=Math.round(s.debt*.01);if(s.cash<0){s.debt+=-s.cash;s.cash=0}if(s.day===7){save();endSeason()}else{s.day++;save();render()}}function endSeason(){let n=net();app.innerHTML='<div class="card"><div class="ey">TEMPORADA CONCLUÍDA</div><div class="title">🏆 Você chegou aos '+s.age+' anos.</div><div class="big">'+money(n)+'</div><p class="muted">Patrimônio líquido ao final do ano.</p><div class="row"><span>XP da temporada</span><b>'+s.seasonXp+'</b></div><div class="row"><span>Caixa</span><b>'+money(s.cash)+'</b></div><div class="row"><span>Investimentos</span><b>'+money(s.invest)+'</b></div><div class="row"><span>Negócios</span><b>'+money(s.biz)+'</b></div><div class="row"><span>Dívidas</span><b>'+money(s.debt)+'</b></div><p>'+badges().join(' • ')+'</p></div><div class="card"><div class="ey">PRÓXIMO ANO</div><div class="title">A vida continua. Nada será zerado.</div><p class="muted">Dinheiro, bens, investimentos, negócios, dívidas, carreira e histórico permanecem. A dificuldade sobe conforme a idade.</p><button class="primary" onclick="nextSeason()">🔄 Viver o próximo ano</button><button class="dark" onclick="ranking()">🏆 Ver ranking</button></div>'}function nextSeason(){if(s.age>=100){s.done=true;save();return finish()}s.age++;s.season++;s.day=1;s.seasonXp=0;s.used=[];prep();save();render()}function ranking(){let r=JSON.parse(localStorage.getItem('dzat_rank03')||'[]');let item={name:s.name,score:Math.round(net()),xp:s.xp,age:s.age};r.push(item);r.sort((a,b)=>b.score-a.score);r=r.slice(0,10);localStorage.setItem('dzat_rank03',JSON.stringify(r));app.innerHTML='<div class="card"><div class="ey">🏆 RANKING LOCAL</div><div class="title">Top 10 por patrimônio</div>'+r.map((x,i)=>'<div class="rank"><b>'+(['🥇','🥈','🥉'][i]||'#'+(i+1))+'</b><strong>'+x.name+'<small class="muted"> '+x.age+' anos • '+x.xp+' XP</small></strong><b>'+money(x.score)+'</b></div>').join('')+'<button class="dark" onclick="render()">Voltar</button></div>'}function finish(){app.innerHTML='<div class="card"><div class="ey">FIM DA JORNADA</div><div class="title">🏆 Você chegou aos 100 anos.</div><div class="big">'+money(net())+'</div><p class="muted">Seu legado foi construído por décadas de escolhas.</p><div class="badges">'+badges().map(x=>'<span class="badge">'+x+'</span>').join('')+'</div></div><div class="card"><button class="primary" onclick="ranking()">🏆 Ver ranking</button></div>'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
