<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--ink:#101827;--muted:#667085;--bg:#eef2f6;--card:#fff;--blue:#4d6fd6;--green:#4d8f68;--gold:#e0b54b;--red:#c95752;--orange:#d98935;--line:#dbe2ea;--soft:#f7f9fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:#101827;color:#fff;padding:42px 22px 32px}header h1{font-size:38px;line-height:1.05;margin:0 0 12px;font-weight:900}header p{margin:0;color:#cbd3df;font-size:20px}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin:16px 0;box-shadow:0 6px 22px #1018270a}.kicker{letter-spacing:4px;color:var(--green);font-weight:900;font-size:15px;margin-bottom:10px}.title{font-size:28px;font-weight:900;margin:0 0 10px}.sub{color:var(--muted);font-size:17px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:15px}.stat small{display:block;color:var(--muted);font-size:14px}.stat b{font-size:24px}.wide{grid-column:1/-1}button,select,input{font:inherit}button{width:100%;border:0;border-radius:18px;padding:16px 14px;font-weight:800;font-size:17px;background:var(--blue);color:#fff;margin-top:10px}button.secondary{background:#edf1f7;color:var(--ink)}button.danger{background:var(--red)}button.gold{background:#e2b64e;color:#1c1c1c}button:disabled{opacity:.42}input,select{width:100%;padding:16px;border:2px solid var(--line);border-radius:16px;background:#fff;margin:7px 0 14px}label{font-weight:800;display:block;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{background:#edf1f7;border-radius:999px;padding:9px 13px;font-weight:700}.progress{height:12px;background:#e5eaf0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.action{border:1px solid var(--line);border-radius:20px;padding:16px;margin:11px 0;background:#fff}.action h3{margin:0 0 4px;font-size:20px}.action p{margin:0;color:var(--muted);line-height:1.35}.action button{margin-top:12px}.event{border:2px solid #f0d98b;background:#fff8dc}.event.urgent{border-color:#e7a45c;background:#fff3e4}.event.danger{border-color:#d77b75;background:#fff0ef}.choice{background:#f7f9fb;color:var(--ink);border:1px solid var(--line);text-align:left}.choice strong{display:block;font-size:17px;margin-bottom:3px}.choice .tiny{display:block}.result{margin-top:14px;padding:14px;border-radius:16px;background:#eff8f2;border:1px solid #cce5d4}.good{color:#28764a}.bad{color:#ad3e39}.warn{color:#9a6419}.tiny{font-size:14px;color:var(--muted)}.meter{height:9px;background:#e7ebef;border-radius:99px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;background:var(--green)}.log{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.4}.log:last-child{border-bottom:0}.heroChoice{border:2px solid #d9c36b;background:#fffdf1}.banner{padding:14px 16px;border-radius:18px;background:#eef4ff;border:1px solid #d5def6;margin-top:12px}.gameover{border:3px solid var(--red);background:#fff0ef}.locked{opacity:.55}.footer{text-align:center;color:#667085;padding:28px 0 50px}
@media(max-width:520px){header h1{font-size:32px}.title{font-size:25px}.grid{grid-template-columns:1fr 1fr}}
</style>
<link rel="manifest" href="./manifest.json"><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=16').catch(()=>{}));</script>
</head><body><header><div class="wrap"><h1>DO ZERO AO TOPO</h1><p>Sua vida. Suas escolhas. Seu futuro.</p><p style="margin-top:12px;font-size:16px">ALPHA 1.6 • vida viva • corpo • emoções • carreira • dinheiro • fases</p></div></header><main class="wrap" id="app"></main>
<script>
const KEY='dzat_alpha16';
const money=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const days=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const paths=['Estudante / ainda vou decidir','Funcionário / CLT','Autônomo / freelancer','Empreendedor','Profissional liberal'];
const stages=()=>S.age<21?'Fundação':S.age<26?'Independência':S.age<36?'Crescimento':S.age<51?'Responsabilidade':'Legado';
const S={name:'',profession:'',path:'',city:'',state:'São Paulo',country:'Brasil',age:18,month:1,day:1,cash:1000,invest:0,assets:0,debt:0,health:88,energy:88,happy:72,stress:18,knowledge:0,experience:0,career:0,relationship:65,time:12,actions:0,event:null,eventDone:false,eventCooldown:[],sick:false,sickDays:0,medicine:false,daysSinceRest:0,workStreak:0,restDays:0,flags:{},logs:[],gameOver:false,created:false,careerStage:'Sem formação',education:0,jobLevel:0,jobTitle:'Sem emprego',monthlyFixed:0,monthIncome:0};
function clamp(){for(const k of ['health','energy','happy','stress','relationship'])S[k]=Math.max(0,Math.min(100,S[k]));S.cash=Math.max(0,S.cash);S.invest=Math.max(0,S.invest);S.assets=Math.max(0,S.assets);S.debt=Math.max(0,S.debt)}
function net(){return S.cash+S.invest+S.assets-S.debt}
function year(){return Math.floor((S.month-1)/12)+1}
function ageAt(){return 18+Math.floor((S.month-1)/12)}
function timeLabel(){return String(7+(12-S.time)).padStart(2,'0')+':00'}
function monthlyIncome(){if(S.gameOver)return 0;let income=0;if(S.jobLevel>0)income=1100+S.jobLevel*550+S.career*28+Math.min(900,S.experience*3)+Math.min(700,S.knowledge*3);else if(S.path==='Autônomo / freelancer'&&S.knowledge>=15)income=500+S.career*20+S.knowledge*3;else if(S.flags.business)income=500+S.flags.businessLevel*600+S.career*24;return Math.round(income)}
function dailyIncome(){return Math.round(monthlyIncome()/22)}
function addLog(t,cls=''){let l=S.logs[0];if(l&&l.m===S.month&&l.d===S.day&&l.t===t)return;S.logs.unshift({m:S.month,d:S.day,t,cls});S.logs=S.logs.slice(0,60)}
function save(){clamp();localStorage.setItem(KEY,JSON.stringify(S))}
function load(){const x=localStorage.getItem(KEY);if(x){try{Object.assign(S,JSON.parse(x))}catch(e){localStorage.removeItem(KEY)}}}
function start(){S.name=document.getElementById('name').value.trim()||'Jogador';S.profession=document.getElementById('profession').value.trim()||'Profissional';S.path=document.getElementById('path').value;S.city=document.getElementById('city').value.trim()||'Sua cidade';S.state=document.getElementById('state').value;S.country=document.getElementById('country').value.trim()||'Brasil';Object.assign(S,{created:true,age:18,month:1,day:1,cash:1000,invest:0,assets:0,debt:0,health:88,energy:88,happy:72,stress:18,knowledge:0,experience:0,career:0,relationship:65,time:12,actions:0,event:null,eventDone:false,eventCooldown:[],sick:false,sickDays:0,medicine:false,daysSinceRest:0,workStreak:0,restDays:0,flags:{},logs:[],gameOver:false,careerStage:'Sem formação',education:0,jobLevel:0,jobTitle:'Sem emprego',monthlyFixed:0,monthIncome:0});addLog('Você começou uma nova vida aos 18 anos com R$ 1.000 no caixa.');pickEvent();save();render()}
function setup(){document.getElementById('app').innerHTML=`<section class="card"><div class="kicker">NOVA VIDA • ALPHA 1.6</div><h2 class="title">Comece aos 18 anos</h2><p class="sub">Agora a vida reage ao excesso. Trabalhar demais pode esgotar, aumentar o estresse e levar à doença. Descansar, estudar, cuidar de relações e administrar dinheiro terão efeitos diferentes conforme a fase da vida.</p><label>Nome</label><input id="name" placeholder="Ex.: Roni"><label>Profissão / sonho</label><input id="profession" placeholder="Ex.: mecânico, médico, programador..."><label>Caminho inicial</label><select id="path">${paths.map(x=>`<option>${x}</option>`).join('')}</select><label>Estado</label><select id="state">${['São Paulo','Minas Gerais','Rio de Janeiro','Paraná','Santa Catarina','Goiás','Distrito Federal','Bahia','Pernambuco','Rio Grande do Sul'].map(x=>`<option>${x}</option>`).join('')}</select><label>Cidade</label><input id="city" placeholder="Ex.: Limeira"><label>País</label><input id="country" value="Brasil"><button onclick="start()">COMEÇAR MINHA VIDA</button></section><section class="card"><div class="kicker">O QUE ESTÁ DIFERENTE</div><div class="sub">🫀 O corpo acumula desgaste.<br>😰 Emoções respondem a dinheiro, relações, cansaço e rotina.<br>🤒 Doença pode surgir quando o excesso cobra a conta.<br>💼 Experiência profissional só cresce com experiência real.<br>🎭 Eventos mudam conforme idade, patrimônio, carreira e escolhas.<br>🌎 A vida passa por fases: Fundação → Independência → Crescimento → Responsabilidade → Legado.</div></section>`}
function eventEligible(e){if(S.eventCooldown.includes(e.id))return false;if(e.req&&!e.req())return false;return true}
function pickEvent(){if(S.eventDone){S.event=null;return}if(S.sick){S.event=sickEvent;return}let pool=events.filter(eventEligible);if(!pool.length){S.event=null;return}pool.sort(()=>Math.random()-.5);S.event=pool[0]}
function choose(i){if(!S.event||S.eventDone||S.gameOver)return;const e=S.event,c=e.choices[i];if(!c)return;if(c.can&&!c.can()){alert(c.block||'Você ainda não pode fazer isso.');return}const msg=c.do();S.eventDone=true;S.eventCooldown.unshift(e.id);S.eventCooldown=S.eventCooldown.slice(0,10);S.event={...e,result:msg};addLog(msg,c.kind==='bad'?'bad':'');bodyCheck();if(S.debt>=100000){S.debt=100000;S.gameOver=true;addLog('GAME OVER: sua dívida atingiu R$ 100.000.','bad')}save();render()}
const sickEvent={id:'sick',type:'health',title:'🤒 O corpo pediu a conta',text:()=>`Você acumulou desgaste demais. Saúde ${Math.round(S.health)}%, energia ${Math.round(S.energy)}% e estresse ${Math.round(S.stress)}%. Hoje continuar no automático pode piorar tudo.`,choices:[
 {t:'Tratar e repousar',s:'Gasta R$ 80 e usa o dia para recuperação.',can:()=>S.cash>=80&&S.time>=4,block:'Você precisa de R$ 80 e 4 horas disponíveis.',do:()=>{S.cash-=80;S.time=0;S.health+=25;S.energy+=30;S.stress-=18;S.happy+=2;S.sickDays=Math.max(0,S.sickDays-2);S.medicine=true;S.workStreak=0;return 'Você tratou a doença e colocou a recuperação acima da produtividade.'}},
 {t:'Repousar sem gastar',s:'Sem custo, mas a recuperação é mais lenta.',can:()=>S.time>=5,block:'Você precisa de pelo menos 5 horas para um repouso adequado.',do:()=>{S.time=0;S.health+=14;S.energy+=28;S.stress-=15;S.happy+=2;S.sickDays=Math.max(0,S.sickDays-1);S.workStreak=0;return 'Você descansou. O dinheiro ficou intacto, mas o corpo precisará de mais tempo.'}},
 {t:'Trabalhar mesmo assim',s:'Mantém parte da renda, mas aumenta bastante o desgaste.',do:()=>{const gain=Math.max(5,Math.round(dailyIncome()*.5));S.cash+=gain;S.health-=16;S.energy-=28;S.stress+=16;S.happy-=9;S.sickDays+=1;S.workStreak+=1;return `Você trabalhou doente e recebeu ${money(gain)}. O preço foi mais desgaste e recuperação mais lenta.`},kind:'bad'}]};
const events=[
{id:'career_start',type:'career',title:'🎯 A primeira porta profissional',req:()=>S.jobLevel===0&&(S.experience>=3||S.education>=12),text:()=>`Seu sonho é ${S.profession}. Agora existe uma diferença entre querer e estar pronto: você precisa transformar formação ou experiência em uma primeira oportunidade.`,choices:[
 {t:'Buscar vaga de entrada',s:'Experiência real começa agora.',do:()=>{S.jobLevel=1;S.jobTitle='Auxiliar / iniciante';S.careerStage='Entrada profissional';S.experience+=4;S.career+=4;S.flags.firstJob=true;return 'Você conseguiu uma vaga de entrada. Agora cada dia de trabalho passa a construir experiência profissional de verdade.'}},
 {t:'Aumentar a formação primeiro',s:'Mais conhecimento, entrada profissional mais tarde.',can:()=>S.time>=4,block:'Você precisa de 4 horas livres.',do:()=>{S.time-=4;S.education+=10;S.knowledge+=7;S.stress+=1;return 'Você decidiu se preparar mais. A oportunidade profissional ficou para depois, mas sua qualificação avançou.'}},
 {t:'Começar por conta própria',s:'Menos estabilidade, mais autonomia.',do:()=>{S.path='Autônomo / freelancer';S.careerStage='Autônomo iniciante';S.career+=3;return 'Você começou a buscar clientes por conta própria. Agora sua renda dependerá de conquistar trabalho.'}}]},
{id:'job_offer',type:'career',title:'💼 Uma proposta aparece',req:()=>S.age>=19&&S.jobLevel===0&&S.knowledge>=10,text:()=>`Uma empresa viu seu perfil. A proposta inicial é de ${money(Math.max(1900,monthlyIncome()+350))} por mês, com horário fixo e cobrança por resultado.`,choices:[
 {t:'Aceitar e começar',s:'Renda previsível e experiência profissional.',do:()=>{S.jobLevel=1;S.jobTitle='Auxiliar / iniciante';S.careerStage='Entrada profissional';S.experience+=5;S.career+=4;S.stress+=3;return 'Você aceitou. A partir de agora trabalho e experiência passam a fazer parte da sua rotina.'}},
 {t:'Negociar antes',s:'Tenta melhorar as condições antes de assumir.',do:()=>{S.career+=2;S.stress+=2;S.flags.negotiating=true;return 'Você decidiu negociar. A empresa pediu alguns dias para responder.'}},
 {t:'Recusar e estudar',s:'Mais preparo agora, entrada depois.',do:()=>{S.knowledge+=5;S.education+=4;S.happy-=1;return 'Você recusou por enquanto e voltou o foco para sua formação.'}}]},
{id:'business',type:'business',title:'🏪 Uma chance de abrir seu próprio negócio',req:()=>!S.flags.business&&(S.path==='Empreendedor'||S.career>=20||S.age>=24),text:'Uma oportunidade local apareceu. Para começar, é preciso colocar capital no negócio. O retorno não é garantido e você terá novas responsabilidades.',choices:[
 {t:'Abrir com R$ 1.000',s:'Cria um ativo produtivo, mas reduz sua reserva.',can:()=>S.cash>=1000,block:'Você precisa ter R$ 1.000 em caixa.',do:()=>{S.cash-=1000;S.assets+=1000;S.flags.business=true;S.flags.businessLevel=1;S.path='Empreendedor';S.careerStage='Empreendedor iniciante';S.career+=8;S.stress+=5;return 'Você abriu o negócio. Agora vendas, custos, clientes e gestão passam a fazer parte da sua vida.'}},
 {t:'Buscar um sócio',s:'Menor aporte, mas decisões e resultados serão divididos.',can:()=>S.cash>=300,block:'Você precisa de R$ 300 para começar a sociedade.',do:()=>{S.cash-=300;S.assets+=300;S.flags.business=true;S.flags.businessLevel=1;S.path='Empreendedor';S.career+=5;S.relationship+=3;S.stress+=3;return 'Você começou com um sócio. O risco financeiro inicial caiu, mas você abriu mão de parte do controle.'}},
 {t:'Esperar',s:'Forma uma reserva antes de assumir o risco.',do:()=>{S.knowledge+=3;S.stress-=2;return 'Você decidiu esperar. A oportunidade passou, mas seu caixa permaneceu protegido.'}}]},
{id:'business_crisis',type:'business',title:'📉 Seu negócio teve um mês ruim',req:()=>S.flags.business,text:'As vendas caíram. Você precisa decidir se protege o caixa, investe para reagir ou reduz custos.',choices:[
 {t:'Cortar custos',s:'Protege o caixa, mas pode reduzir capacidade.',do:()=>{S.cash+=120;S.assets=Math.max(0,S.assets-60);S.stress+=4;return 'Você cortou custos. O caixa respirou, mas o negócio perdeu parte da capacidade.'}},
 {t:'Investir R$ 200 para reagir',s:'Aposta na recuperação.',can:()=>S.cash>=200,block:'Você não tem R$ 200 disponíveis.',do:()=>{S.cash-=200;S.assets+=100;S.flags.businessLevel=Math.min(5,S.flags.businessLevel+1);S.career+=5;S.stress+=7;return 'Você investiu na reação. O negócio ficou mais estruturado, mas agora precisa entregar resultado.'}},
 {t:'Parar por enquanto',s:'Evita consumir mais caixa.',do:()=>{S.flags.business=false;S.flags.businessPaused=true;S.stress-=3;return 'Você pausou o negócio para proteger o patrimônio. Recomeçar será possível mais adiante.'}}]},
{id:'promotion',type:'career',title:'📈 Mais responsabilidade',req:()=>S.jobLevel>=1&&(S.experience>=35||S.career>=25),text:'Seu trabalho mudou de patamar. A próxima função paga mais, mas exige mais responsabilidade e tempo.',choices:[
 {t:'Aceitar a promoção',s:'Renda maior e cobrança maior.',do:()=>{S.jobLevel=Math.min(5,S.jobLevel+1);S.jobTitle=['','Auxiliar / iniciante','Profissional','Especialista','Coordenador','Gestor'][S.jobLevel];S.career+=8;S.experience+=5;S.stress+=7;return `Você avançou para ${S.jobTitle}. A renda potencial aumentou e sua responsabilidade também.`}},
 {t:'Pedir treinamento',s:'Prepara-se antes de assumir a nova função.',do:()=>{S.knowledge+=7;S.education+=4;S.experience+=2;S.time=Math.max(0,S.time-2);return 'Você pediu treinamento. O avanço será mais lento, mas sua preparação aumentou.'}},
 {t:'Recusar por enquanto',s:'Preserva energia e rotina.',do:()=>{S.energy+=6;S.stress-=6;return 'Você recusou por enquanto. Crescer também envolve saber quando não assumir mais carga.'}}]},
{id:'rent',type:'life',title:'🏠 Independência bate à porta',req:()=>S.age>=20&&!S.flags.rent&&S.cash>=1200,text:'Você quer mais autonomia. Um lugar próprio custa dinheiro todos os meses e muda sua rotina.',choices:[
 {t:'Alugar',s:'Mais autonomia e uma nova despesa fixa.',can:()=>S.cash>=900,block:'Você precisa de R$ 900 para a entrada.',do:()=>{S.cash-=900;S.flags.rent=true;S.monthlyFixed+=900;S.happy+=7;S.stress+=5;return 'Você assumiu seu próprio lugar. A liberdade aumentou, e agora o aluguel também faz parte da sua vida.'}},
 {t:'Continuar com a família',s:'Preserva caixa e patrimônio.',do:()=>{S.cash+=50;S.relationship+=2;S.stress-=2;return 'Você ficou mais um tempo com a família e reforçou sua base financeira.'}},
 {t:'Dividir moradia',s:'Menor custo com mais autonomia.',can:()=>S.cash>=500,block:'Você precisa de R$ 500 para a mudança.',do:()=>{S.cash-=500;S.flags.rent=true;S.monthlyFixed+=500;S.relationship-=2;return 'Você dividiu moradia. O custo caiu, mas a convivência passou a exigir adaptação.'}}]},
{id:'debt',type:'money',title:'💳 A dívida começou a incomodar',req:()=>S.debt>=100,text:()=>`Você deve ${money(S.debt)}. O dinheiro que poderia construir patrimônio está sendo puxado para trás pela dívida.`,choices:[
 {t:'Pagar R$ 200 agora',s:'Reduz o saldo e o peso dos juros.',can:()=>S.cash>=200,block:'Você não tem R$ 200 livres.',do:()=>{S.cash-=200;S.debt=Math.max(0,S.debt-200);S.stress-=5;S.happy+=2;return 'Você amortizou R$ 200 da dívida. Menos passivo, mais espaço para respirar.'}},
 {t:'Pagar 25% do caixa',s:'Faz um esforço proporcional à sua reserva.',can:()=>S.cash>=100,block:'Seu caixa está muito baixo para essa amortização.',do:()=>{let p=Math.round(S.cash*.25);S.cash-=p;S.debt=Math.max(0,S.debt-p);S.stress-=3;return `Você usou ${money(p)} para amortizar a dívida.`}},
 {t:'Deixar para depois',s:'Mantém caixa agora, mas a dívida continua pressionando.',do:()=>{S.stress+=5;S.happy-=5;return 'Você adiou o pagamento. O caixa ficou preservado, mas o problema continuou vivo.'},kind:'bad'}]},
{id:'emergency',type:'money',title:'⚡ Um imprevisto financeiro',req:()=>S.age>=18,text:'Uma despesa inesperada de R$ 600 apareceu. Agora sua reserva e sua capacidade de lidar com dívida são colocadas à prova.',choices:[
 {t:'Pagar com a reserva',s:'Sem novos juros, mas reduz seu colchão.',can:()=>S.cash>=600,block:'Sua reserva não cobre R$ 600.',do:()=>{S.cash-=600;S.stress+=2;return 'Você pagou à vista e evitou uma nova dívida. Sua reserva, porém, ficou menor.'}},
 {t:'Parcelar em 6x',s:'Resolve hoje, mas cria um passivo maior.',do:()=>{S.debt+=660;S.flags.emergencyDebt=true;S.stress+=7;S.happy-=3;return 'Você parcelou. O problema foi resolvido agora, mas R$ 660 entraram no passivo.'}},
 {t:'Cortar outro gasto e negociar',s:'Menor impacto financeiro imediato, maior esforço.',do:()=>{S.cash=Math.max(0,S.cash-100);S.stress+=4;S.relationship-=2;return 'Você reduziu outro gasto e negociou a despesa. Foi desconfortável, mas evitou uma dívida maior.'}}]},
{id:'market',type:'money',title:'📉 O mercado caiu',req:()=>S.invest>0,text:()=>`Sua carteira vale ${money(S.invest)}. Uma queda de mercado reduziu temporariamente seu patrimônio financeiro.`,choices:[
 {t:'Manter',s:'Aceita a volatilidade e preserva a estratégia.',do:()=>{let loss=Math.round(S.invest*.08);S.invest-=loss;S.experience+=2;return `Sua carteira recuou ${money(loss)}. Você manteve a posição e aprendeu com a volatilidade.`}},
 {t:'Resgatar metade',s:'Reduz exposição, mas realiza parte da perda.',do:()=>{let half=Math.round(S.invest*.5),loss=Math.round(half*.08);S.invest-=half;S.cash+=half-loss;return `Você resgatou metade e realizou uma perda de ${money(loss)}.`}},
 {t:'Aumentar R$ 100',s:'Mais exposição em um momento de queda.',can:()=>S.cash>=100,block:'Você não tem R$ 100 livres.',do:()=>{S.cash-=100;S.invest+=100;S.stress+=4;return 'Você aumentou a posição. O potencial futuro cresceu junto com o risco.'}}]},
{id:'family',type:'life',title:'👨‍👩‍👧 A família precisa de você',req:()=>S.age>=20,text:'Uma pessoa próxima precisa de ajuda. Dinheiro, tempo e vínculo estão todos na mesa.',choices:[

function bodyCheck(){
 if(S.energy<45)S.stress+=2;
 if(S.energy<25){S.stress+=5;S.happy-=4;S.health-=2}
 if(S.energy<12){S.stress+=7;S.happy-=5;S.health-=4}
 if(S.stress>55)S.happy-=2;
 if(S.stress>75){S.happy-=5;S.health-=2}
 if(S.debt>0)S.happy-=Math.min(5,Math.ceil(S.debt/3000));
 if(S.cash<100)S.happy-=3;
 if(S.relationship<40)S.happy-=3;
 if(S.daysSinceRest>=5){S.stress+=3;S.happy-=3;S.health-=2}
 const overload=(S.stress>=82?1:0)+(S.energy<=12?1:0)+(S.health<=42?1:0)+(S.workStreak>=4?1:0);
 if(!S.sick&&overload>=2){S.sick=true;S.sickDays=1;S.health-=10;S.stress+=10;S.happy-=10;addLog('🤒 Você ficou doente. O excesso acumulado finalmente cobrou a conta.','bad')}
 clamp();
}
function activity(fn,h,kind='normal'){if(S.time<h||S.gameOver)return;S.time-=h;fn();S.actions++;S.daysSinceRest++;if(kind==='work'){S.workStreak++;}else if(kind==='rest'){S.workStreak=0;S.restDays++;S.daysSinceRest=0}S.energy-=kind==='work'?Math.max(5,h*5):Math.max(2,h*2);if(kind==='work')S.stress+=Math.max(2,h*1.7);else S.stress+=Math.max(0,h-2);bodyCheck();save();render()}
function study(){activity(()=>{S.knowledge+=4;S.education+=3;if(S.energy<35)S.stress+=4;if(S.happy>90)S.happy-=1;addLog('Você estudou por 2 horas. Conhecimento +4 e formação +3.')} ,2,'study')}
function work(){if(S.sick){alert('Você está doente. Primeiro resolva o tratamento ou o repouso do acontecimento atual.');return}let h=S.jobLevel>0?Math.min(8,S.time):S.path==='Autônomo / freelancer'?Math.min(6,S.time):S.flags.business?Math.min(8,S.time):0;if(h<1){alert('Você ainda não tem uma atividade profissional que gere renda. Estude, procure uma vaga ou construa um negócio.');return}activity(()=>{let gain=0;if(S.jobLevel>0)gain=Math.max(0,Math.round(dailyIncome()*(h/8)));else if(S.path==='Autônomo / freelancer')gain=Math.round((55+S.knowledge*2+S.career*2)*(h/6));else if(S.flags.business)gain=Math.round((45*S.flags.businessLevel+S.career)*(h/8));if(h>=6){S.happy-=2;S.health-=2}if(h>=8){S.stress+=5;S.energy-=6}S.cash+=gain;S.career+=1;S.experience+=h>=4?2:1;addLog(`Você trabalhou por ${h} horas e recebeu ${money(gain)}.`,'good')},h,'work')}
function health(){activity(()=>{if(S.sick){S.health+=8;S.energy-=3;S.stress-=5;addLog('Você cuidou do corpo durante a doença.')}else{S.health+=5;S.happy+=2;S.stress-=5;addLog('Você cuidou da saúde.')}},1,'health')}
function rest(){activity(()=>{S.energy+=18;S.health+=3;S.stress-=10;S.happy+=2;S.workStreak=0;addLog('Você tirou algumas horas para descansar. O corpo agradeceu.')},3,'rest')}
function social(){activity(()=>{let c=35;if(S.cash>=c)S.cash-=c;else S.debt+=c;S.happy+=5;S.relationship+=7;S.stress-=7;addLog('Você reservou tempo para sua vida pessoal.')},2,'social')}
function moneyAction(){activity(()=>{let saved=S.debt>0?20:10;S.cash+=saved;S.stress-=3;addLog(`Você revisou o orçamento e encontrou ${money(saved)} em economia.`,'good')},1,'money')}
function payDebt(){if(S.debt<=0){alert('Você não tem dívida para pagar.');return}if(S.cash<100){alert('Mantenha pelo menos R$ 100 no caixa antes de amortizar a dívida.');return}const p=Math.min(S.debt,Math.max(100,Math.round(S.cash*.25)));S.cash-=p;S.debt-=p;S.stress-=5;S.happy+=2;addLog(`Você amortizou ${money(p)} da dívida.`,'good');bodyCheck();save();render()}
function businessManage(){if(!S.flags.business){alert('Você ainda não tem um negócio.');return}activity(()=>{let gain=Math.round(70*S.flags.businessLevel+S.knowledge*2);S.cash+=gain;S.assets+=20;S.career+=2;S.stress+=4;addLog(`Você administrou o negócio e gerou ${money(gain)} de resultado.`,'good')},2,'work')}
function endDay(){if(S.gameOver)return;if(!S.eventDone){addLog('Você terminou o dia sem resolver o acontecimento principal. A oportunidade passou.','bad');S.stress+=6;S.happy-=6}
let cost=15+(S.age>=22?10:0)+(S.age>=35?10:0);if(S.flags.rent)cost+=30;if(S.flags.business)cost+=8;if(S.flags.car)cost+=6;
if(S.cash>=cost)S.cash-=cost;else{S.debt+=cost;S.stress+=6;S.happy-=5;addLog(`Você não tinha caixa para o custo diário de ${money(cost)}. A despesa foi para a dívida.`,'bad')}
// recuperação do sono: problemas não somem magicamente
let rec=S.sick?10:(S.stress>70?16:24);S.energy+=rec;S.stress-=S.sick?7:12;S.health+=S.sick?2:3;if(S.stress>65||S.debt>0||S.cash<100)S.happy-=2;else S.happy-=1;if(S.sick)S.sickDays++;
if(S.sick&&S.health>=72&&S.sickDays>=2){S.sick=false;S.sickDays=0;S.medicine=false;addLog('Você se recuperou e voltou à rotina.','good')}
bodyCheck();S.day++;S.time=12;S.actions=0;S.eventDone=false;S.event=null;S.flags.healthToday=false;S.flags.socialToday=false;
if(S.day>30){S.day=1;S.month++;monthlyClose()}
if(S.debt>=100000){S.debt=100000;S.gameOver=true;addLog('GAME OVER: sua dívida atingiu R$ 100.000.','bad')}
pickEvent();save();render();window.scrollTo({top:0,behavior:'smooth'})}
function monthlyClose(){const interest=Math.round(S.debt*.03);if(interest>0){S.debt+=interest;addLog(`Fechamento do mês: juros de 3% sobre a dívida = ${money(interest)}.`,'bad')}
if(S.invest>0){const r=(Math.random()*.06)-.015;const ch=Math.round(S.invest*r);S.invest=Math.max(0,S.invest+ch);addLog(`Mercado do mês: ${ch>=0?'+':''}${money(ch)} nos investimentos.`,ch>=0?'good':'bad')}
if(S.monthlyFixed>0){if(S.cash>=S.monthlyFixed)S.cash-=S.monthlyFixed;else{S.debt+=S.monthlyFixed;S.stress+=7;S.happy-=5;addLog(`As despesas fixas de ${money(S.monthlyFixed)} viraram dívida por falta de caixa.`,'bad')}}
S.monthIncome=monthlyIncome();if(S.month%12===1){S.age=ageAt();S.careerStage=S.jobLevel>0?S.careerStage:'Sem formação';addLog(`Você completou mais um ano de vida. Agora tem ${S.age} anos.`,'good')}
if(S.flags.business&&S.flags.businessPaused){S.flags.business=false;S.flags.businessPaused=false}
}
function lifeMood(){if(S.sick)return 'Seu corpo está pedindo pausa';if(S.stress>=85)return 'Pressão no limite';if(S.energy<25)return 'Exaustão acumulada';if(S.debt>=5000)return 'A dívida está pesando';if(S.relationship<35)return 'Vida pessoal esquecida';if(S.happy<35)return 'Dias emocionalmente difíceis';if(S.happy>88&&S.stress<30&&S.debt===0)return 'Momento muito positivo';if(S.stress>55)return 'Rotina pesada';return 'Equilíbrio em construção'}
function statMood(v){return Math.round(v)}
function render(){if(!S.created){setup();return}if(!S.event&&!S.eventDone&&!S.gameOver)pickEvent();const e=S.event;let pct=Math.round((S.day/30)*100);let ec=e&&e.type==='health'?'event urgent':e&&e.type==='money'?'event danger':'event';let html=`<section class="card"><div class="kicker">ANO ${year()} • MÊS ${((S.month-1)%12)+1}/12 • DIA ${S.day}/30</div><h2 class="title">${days[(S.day-1)%7]} — ${S.age} anos</h2><div class="chips"><span class="chip">💼 ${S.profession}</span><span class="chip">📍 ${S.city} — ${S.state}</span><span class="chip">⏰ ${timeLabel()}</span><span class="chip">🧭 ${stages()}</span>${S.debt>0?`<span class="chip">💳 Dívida ${money(S.debt)}</span>`:''}${S.sick?'<span class="chip">🤒 DOENTE</span>':''}${S.flags.business?'<span class="chip">🏪 NEGÓCIO</span>':''}${S.flags.car?'<span class="chip">🚗 VEÍCULO</span>':''}${S.jobLevel>0?`<span class="chip">🏢 ${S.jobTitle}</span>`:''}</div><div class="grid"><div class="stat"><small>💰 Caixa</small><b>${money(S.cash)}</b></div><div class="stat"><small>📈 Patrimônio líquido</small><b>${money(net())}</b></div><div class="stat"><small>❤️ Saúde</small><b>${statMood(S.health)}%</b></div><div class="stat"><small>⚡ Energia</small><b>${statMood(S.energy)}%</b></div><div class="stat"><small>😊 Felicidade</small><b>${statMood(S.happy)}%</b></div><div class="stat"><small>🧠 Estresse</small><b>${statMood(S.stress)}%</b></div><div class="stat"><small>📚 Conhecimento</small><b>${S.knowledge}</b></div><div class="stat"><small>💼 Experiência real</small><b>${S.experience}</b></div><div class="stat"><small>💳 Dívida</small><b>${money(S.debt)}</b></div><div class="stat"><small>🏦 Investimentos</small><b>${money(S.invest)}</b></div></div><p class="tiny" style="margin-top:15px">Clima da vida: <b>${lifeMood()}</b> • Fase: <b>${stages()}</b> • Tempo: <b>${S.time}h</b> • Renda mensal estimada: <b>${money(monthlyIncome())}</b></p><div class="progress"><i style="width:${pct}%"></i></div><p class="tiny">Progresso do mês: ${pct}% • Dias sem descanso: ${S.daysSinceRest} • Sequência de trabalho: ${S.workStreak}</p></section>`;
if(e){html+=`<section class="card ${ec}"><div class="kicker">⚡ ACONTECEU AGORA</div><h2 class="title">${e.title}</h2><p class="sub">${typeof e.text==='function'?e.text():e.text}</p>${e.choices.map((c,i)=>`<button class="choice ${i===0?'heroChoice':''}" onclick="choose(${i})" ${S.eventDone?'disabled':''}><strong>${c.t}</strong><span class="tiny">${typeof c.s==='function'?c.s():c.s}</span></button>`).join('')}${S.eventDone?`<div class="result"><b>Decisão registrada.</b><br>${e.result||''}<br><span class="tiny">A consequência entrou na história da sua vida.</span></div>`:''}</section>`}
html+=`<section class="card"><div class="kicker">AGENDA DE HOJE</div><h2 class="title">${S.time>0?'Você decide como viver o dia':'Seu tempo acabou'}</h2><div class="action"><h3>🎓 Estudar</h3><p>2h • conhecimento +4 • formação +3 • não gera experiência profissional.</p><button onclick="study()" ${S.time<2?'disabled':''}>ESTUDAR AGORA</button></div><div class="action"><h3>💼 Trabalhar</h3><p>Experiência real, renda e desgaste. Quanto mais horas, maior o custo físico e emocional.</p><button onclick="work()" ${S.time<1||S.sick?'disabled':''}>IR TRABALHAR</button></div>${S.flags.business?`<div class="action"><h3>🏪 Administrar negócio</h3><p>2h • resultado financeiro • patrimônio • carreira • pressão.</p><button onclick="businessManage()" ${S.time<2?'disabled':''}>ADMINISTRAR</button></div>`:''}<div class="action"><h3>🏃 Cuidar da saúde</h3><p>1h • recuperação física • reduz estresse. Doente, ajuda na recuperação.</p><button onclick="health()" ${S.time<1?'disabled':''}>CUIDAR DA SAÚDE</button></div><div class="action"><h3>😴 Descansar</h3><p>3h • energia +18 • saúde +3 • estresse -10 • zera a sequência de trabalho.</p><button onclick="rest()" ${S.time<3?'disabled':''}>DESCANSAR UM POUCO</button></div><div class="action"><h3>❤️ Vida pessoal</h3><p>2h • relações +7 • felicidade +5 • estresse -7.</p><button onclick="social()" ${S.time<2?'disabled':''}>VIVER UM POUCO</button></div><div class="action"><h3>💰 Organizar dinheiro</h3><p>1h • encontra economia • reduz pressão financeira.</p><button onclick="moneyAction()" ${S.time<1?'disabled':''}>ORGANIZAR</button></div>${S.debt>0?`<div class="action"><h3>💳 Amortizar dívida</h3><p>Usa 25% do caixa disponível para reduzir o passivo.</p><button class="gold" onclick="payDebt()">PAGAR PARTE DA DÍVIDA</button></div>`:''}<button class="secondary" onclick="endDay()">🌙 ENCERRAR O DIA E DORMIR</button></section>`;
html+=`<section class="card"><div class="kicker">HISTÓRIA DA SUA VIDA</div>${S.logs.length?S.logs.map(x=>`<div class="log ${x.cls||''}">• Mês ${x.m} / Dia ${x.d} — ${x.t}</div>`).join(''):'<p class="sub">Sua história começa agora.</p>'}</section>`;
if(S.gameOver)html+=`<section class="card gameover"><div class="kicker">FIM DA LINHA</div><h2 class="title">GAME OVER</h2><p class="sub">Sua dívida atingiu R$ 100.000. As escolhas financeiras se acumularam até ultrapassar o limite.</p><button class="danger" onclick="restart()">RECOMEÇAR DO ZERO</button></section>`;else html+=`<section class="card"><button class="danger" onclick="restart()">RECOMEÇAR DO ZERO</button></section>`;html+=`<div class="footer">DO ZERO AO TOPO — ALPHA 1.6</div>`;document.getElementById('app').innerHTML=html}
function restart(){if(confirm('Recomeçar a vida do zero?')){localStorage.removeItem(KEY);location.reload()}}
load();render();
</script></body></html>
