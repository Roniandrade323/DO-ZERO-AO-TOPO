<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>DO ZERO AO TOPO — ALPHA 1.1</title>
<style>
:root{--ink:#101827;--muted:#667085;--bg:#eef2f6;--card:#fff;--blue:#4d6fd6;--green:#4d8f68;--gold:#e0b54b;--red:#c95752;--line:#dbe2ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
header{background:#101827;color:#fff;padding:42px 22px 32px}header h1{font-size:38px;line-height:1.05;margin:0 0 12px;font-weight:900}header p{margin:0;color:#cbd3df;font-size:20px}.wrap{max-width:820px;margin:auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin:16px 0;box-shadow:0 6px 22px #1018270a}
.kicker{letter-spacing:4px;color:var(--green);font-weight:900;font-size:16px;margin-bottom:10px}.title{font-size:28px;font-weight:900;margin:0 0 10px}.sub{color:var(--muted);font-size:17px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f7f9fb;border:1px solid var(--line);border-radius:20px;padding:15px}.stat small{display:block;color:var(--muted);font-size:14px}.stat b{font-size:25px}.wide{grid-column:1/-1}
button,select,input{font:inherit}button{width:100%;border:0;border-radius:18px;padding:17px 14px;font-weight:800;font-size:17px;background:var(--blue);color:white;margin-top:10px}button.secondary{background:#edf1f7;color:var(--ink)}button.danger{background:var(--red)}button:disabled{opacity:.42}
input,select{width:100%;padding:16px;border:2px solid var(--line);border-radius:16px;background:white;margin:7px 0 14px}
label{font-weight:800;display:block;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{background:#edf1f7;border-radius:999px;padding:9px 13px;font-weight:700}
.progress{height:12px;background:#e5eaf0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
.action{border:1px solid var(--line);border-radius:20px;padding:16px;margin:11px 0;background:#fff}.action h3{margin:0 0 4px;font-size:20px}.action p{margin:0;color:var(--muted);line-height:1.35}.action button{margin-top:12px}
.event{border:2px solid #f0d98b;background:#fff8dc}.choice{background:#f7f9fb;color:var(--ink);border:1px solid var(--line);text-align:left}.choice strong{display:block}.log{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.4}.good{color:#28764a}.bad{color:#ad3e39}.tiny{font-size:14px;color:var(--muted)}
@media(max-width:520px){header h1{font-size:32px}.grid{grid-template-columns:1fr 1fr}.title{font-size:25px}.stat b{font-size:23px}}
</style>
<link rel="manifest" href="./manifest.json"><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=11').catch(()=>{}));</script></head>
<body>
<header><div class="wrap"><h1>DO ZERO AO TOPO</h1><p>Sua vida. Suas escolhas. Seu futuro.</p><p style="margin-top:12px;font-size:16px">ALPHA 1.1 • vida jogável • rotina • carreira • dinheiro • consequências</p></div></header>
<main class="wrap" id="app"></main>
<script>
const KEY="dzat_alpha11";
const money=n=>"R$ "+Math.round(n).toLocaleString("pt-BR");
const days=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const archetypes={
 "Estudante / ainda vou decidir":{income:0,work:0,study:true},
 "Funcionário / CLT":{income:2300,work:8,study:false},
 "Autônomo / freelancer":{income:1800,work:6,study:false},
 "Empreendedor":{income:1400,work:8,study:false},
 "Profissional liberal":{income:2600,work:7,study:false}
};
const state={name:"",profession:"",path:"",city:"",age:18,month:1,day:1,cash:1000,invest:0,assets:0,debt:0,health:90,energy:85,happy:70,stress:20,knowledge:0,experience:0,career:0,time:7,actions:0,eventDone:false,logs:[],last:"Sua vida começou com R$ 1.000 no caixa.",monthXP:0,totalXP:0,gameOver:false};

const eventBank=[
 {id:"course",title:"Uma oportunidade aparece",text:"Você recebe uma mensagem sobre um curso que pode melhorar sua carreira. A matrícula custa R$ 180.",choices:[
  ["Investir no curso",()=>{if(state.cash>=180){state.cash-=180;state.knowledge+=8;state.career+=3;state.happy+=2;return "Curso pago. Seu conhecimento aumentou."}state.debt+=180;state.knowledge+=8;return "Você financiou o curso e agora tem uma dívida de R$ 180."}],
  ["Pesquisar uma opção gratuita",()=>{state.knowledge+=3;state.time=Math.max(0,state.time-1);return "Você pesquisou e encontrou material gratuito. Menos impacto financeiro, mas consumiu tempo."}],
  ["Deixar para depois",()=>{state.stress=Math.min(100,state.stress+2);return "Você preservou o caixa, mas perdeu a oportunidade por enquanto."}]
 ]},
 {id:"friend",title:"Convite inesperado",text:"Um amigo chamou você para sair hoje à noite. Você está construindo sua vida, mas também precisa viver.",choices:[
  ["Aceitar",()=>{let c=70;if(state.cash>=c)state.cash-=c;else state.debt+=c;state.happy=Math.min(100,state.happy+10);state.stress=Math.max(0,state.stress-6);return "Você saiu, gastou R$ 70 e voltou com a cabeça mais leve."}],
  ["Encontro barato",()=>{state.cash=Math.max(0,state.cash-20);state.happy=Math.min(100,state.happy+5);state.stress=Math.max(0,state.stress-3);return "Você encontrou uma alternativa barata e manteve a vida social."}],
  ["Ficar em casa",()=>{state.cash+=20;state.happy=Math.max(0,state.happy-2);return "Você economizou, mas abriu mão do encontro."}]
 ]},
 {id:"phone",title:"Seu celular começa a falhar",text:"A bateria está ruim e isso pode atrapalhar trabalho e estudos.",choices:[
  ["Consertar por R$ 120",()=>{if(state.cash>=120)state.cash-=120;else state.debt+=120;state.experience+=1;return "Celular consertado. Você evita um problema maior."}],
  ["Usar assim mesmo",()=>{state.stress=Math.min(100,state.stress+5);return "Você adiou o gasto. Por enquanto funciona."}],
  ["Comprar usado por R$ 450",()=>{if(state.cash>=450)state.cash-=450;else state.debt+=450;state.assets+=450;state.experience+=2;return "Você comprou um aparelho usado. Agora possui um bem, mas comprometeu caixa."}]
 ]},
 {id:"job",title:"Uma porta se abre",text:"Uma oportunidade de trabalho apareceu. Ela exige 4 horas hoje para uma entrevista/teste.",choices:[
  ["Fazer o teste",()=>{state.time=Math.max(0,state.time-4);state.career+=6;state.experience+=2;state.stress+=3;state.last="Você correu atrás de uma oportunidade profissional.";return "Teste concluído. Sua carreira ganhou experiência."}],
  ["Recusar e estudar",()=>{state.knowledge+=6;state.time=Math.max(0,state.time-3);return "Você priorizou conhecimento. A oportunidade ficou para trás."}],
  ["Não fazer nada",()=>{state.stress=Math.max(0,state.stress-2);return "Você preservou energia, mas não avançou nessa oportunidade."}]
 ]},
 {id:"family",title:"A família precisa de você",text:"Uma despesa inesperada de R$ 250 surgiu em casa. Ninguém é obrigado a resolver sozinho, mas você pode ajudar.",choices:[
  ["Ajudar com R$ 250",()=>{if(state.cash>=250)state.cash-=250;else state.debt+=250;state.happy+=5;return "Você ajudou. O caixa diminuiu, mas sua relação familiar melhorou."}],
  ["Ajudar com R$ 100",()=>{if(state.cash>=100)state.cash-=100;else state.debt+=100;state.happy+=3;return "Você ajudou dentro do seu limite."}],
  ["Não posso agora",()=>{state.stress+=4;return "Você preservou o caixa, mas ficou com a sensação de não ter conseguido ajudar."}]
 ]},
 {id:"investment",title:"O mercado chama sua atenção",text:"Você vê uma oportunidade de investimento. Lembre-se: retorno potencial sempre vem acompanhado de risco.",choices:[
  ["Investir R$ 100",()=>{if(state.cash>=100){state.cash-=100;state.invest+=100;state.experience+=2;return "Você investiu R$ 100. Agora parte do seu patrimônio está exposta ao mercado."}return "Sem caixa suficiente, você decidiu não investir."}],
  ["Guardar no caixa",()=>{state.happy+=1;return "Você preferiu liquidez. Às vezes esperar também é uma estratégia."}],
  ["Estudar antes",()=>{state.knowledge+=5;state.time=Math.max(0,state.time-2);return "Você estudou antes de colocar dinheiro em risco."}]
 ]},
 {id:"health",title:"Seu corpo manda um aviso",text:"Você dormiu mal e acordou cansado. Hoje existe uma escolha: produtividade imediata ou recuperação.",choices:[
  ["Descansar 3 horas",()=>{state.time=Math.max(0,state.time-3);state.energy=Math.min(100,state.energy+18);state.health=Math.min(100,state.health+3);state.stress=Math.max(0,state.stress-8);return "Você recuperou energia e reduziu o estresse."}],
  ["Treinar 1 hora",()=>{state.time=Math.max(0,state.time-1);state.energy=Math.max(0,state.energy-8);state.health=Math.min(100,state.health+6);state.happy+=4;return "Treino concluído. Saúde melhorou, mas você gastou energia."}],
  ["Ignorar",()=>{state.energy=Math.max(0,state.energy-10);state.stress+=8;return "Você seguiu no automático. O corpo cobrou o preço."}]
 ]}
];

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){let x=localStorage.getItem(KEY);if(x)Object.assign(state,JSON.parse(x))}
function fmtDate(){return `${days[state.day%7]} — ${state.age} anos`}
function net(){return state.cash+state.invest+state.assets-state.debt}
function monthlyIncome(){let a=archetypes[state.path]||archetypes["Estudante / ainda vou decidir"];return a.income+state.career*45+state.knowledge*10}
function addLog(t,cls=""){state.logs.unshift({d:`Dia ${state.day}`,t,cls});state.logs=state.logs.slice(0,20)}
function clamp(){state.health=Math.max(0,Math.min(100,state.health));state.energy=Math.max(0,Math.min(100,state.energy));state.happy=Math.max(0,Math.min(100,state.happy));state.stress=Math.max(0,Math.min(100,state.stress));state.totalXP=Math.max(0,state.totalXP);state.monthXP=Math.max(0,state.monthXP)}
function action(title,hours,fn){
 if(state.time<hours)return;
 state.time-=hours;state.actions++;fn();state.energy-=Math.max(2,hours*2);state.stress+=Math.max(0,hours-2);state.experience+=1;state.monthXP+=10;state.totalXP+=10;clamp();save();render();
}
function incomeTick(){
 let inc=Math.round(monthlyIncome()/30);
 if(inc>0){state.cash+=inc;addLog(`Renda do dia: ${money(inc)}.`,"good")}
}
function dailyCost(){let cost=15+(state.age>=22?10:0);if(state.cash>=cost)state.cash-=cost;else state.debt+=cost;addLog(`Custo diário de vida: ${money(cost)}.`)}
function eventForToday(){let eligible=eventBank.filter(e=>e.id!=="health"||state.energy<70);return eligible[(state.day-1)%eligible.length]}
function doEvent(i){let e=eventForToday();let result=e.choices[i][1]();state.eventDone=true;state.monthXP+=25;state.totalXP+=25;addLog(result);clamp();save();render()}
function doStudy(){action("Estudar",2,()=>{state.knowledge+=4;state.happy+=1;addLog("Você estudou por 2 horas. Conhecimento +4.")})}
function doWork(){let hours=archetypes[state.path]?.work||4;if(hours===0)hours=4;action("Trabalhar",Math.min(hours,state.time),()=>{let gain=Math.round(monthlyIncome()/22/Math.max(1,hours/8));state.cash+=gain;state.career+=1;addLog(`Você trabalhou e recebeu ${money(gain)}.`,"good")})}
function doExercise(){action("Cuidar da saúde",1,()=>{state.health+=5;state.happy+=4;state.stress-=4;addLog("Você cuidou da saúde.")})}
function doSocial(){action("Vida pessoal",2,()=>{let c=35;if(state.cash>=c)state.cash-=c;else state.debt+=c;state.happy+=8;state.stress-=7;addLog("Você reservou tempo para sua vida pessoal.")})}
function doMoney(){action("Organizar dinheiro",1,()=>{state.cash+=10;state.stress-=2;addLog("Você revisou o orçamento e encontrou R$ 10 em economia.")})}
function doSleep(){let missing=16-state.time;state.energy=Math.min(100,state.energy+25);state.health+=2;state.stress-=10;state.time=0;addLog("Você encerrou o dia e descansou.");advanceDay()}
function advanceDay(){
 if(!state.eventDone){addLog("Você terminou o dia sem resolver o acontecimento que apareceu hoje.","bad");state.stress+=3}
 dailyCost();incomeTick();state.day++;state.eventDone=false;state.time=7;state.actions=0;
 if(state.day>30){state.day=1;state.month++;state.monthXP=0;state.age++;if(state.debt>0){let interest=Math.round(state.debt*.02);state.debt+=interest;addLog(`Fechamento do mês: juros da dívida +${money(interest)}.`,"bad")}state.cash+=Math.round(monthlyIncome()*.05);addLog(`Novo mês. Você completou mais um capítulo aos ${state.age} anos.`,"good")}
 if(state.debt>=100000){state.gameOver=true}
 save();render()
}
function restart(){if(confirm("Recomeçar a vida do zero?")){localStorage.removeItem(KEY);location.reload()}}
function setup(){
document.getElementById("app").innerHTML=`<section class="card"><div class="kicker">NOVA VIDA</div><h2 class="title">Comece aos 18 anos</h2><p class="sub">Aqui você não fica apertando uma pergunta por dia. Você vive um dia: escolhe o que fazer, administra tempo e energia, trabalha, estuda, descansa, resolve problemas e enfrenta consequências.</p>
<label>Nome</label><input id="name" placeholder="Ex.: Roni">
<label>Profissão que você quer seguir</label><input id="profession" placeholder="Ex.: médico, mecânico, programador, contador...">
<label>Caminho inicial</label><select id="path">${Object.keys(archetypes).map(x=>`<option>${x}</option>`).join("")}</select>
<label>Cidade</label><input id="city" placeholder="Ex.: Limeira">
<button onclick="start()">COMEÇAR MINHA VIDA</button>
</section>
<section class="card"><div class="kicker">COMO JOGA</div><p class="sub">⏰ Você começa às 07:00. Cada atividade consome horas. 💰 Dinheiro entra e sai todos os dias. ❤️ Saúde, energia, felicidade e estresse mudam. 💼 Sua profissão define oportunidades. 🎓 Conhecimento abre caminhos. ⚠️ Dívida cresce e pode levar ao GAME OVER em R$ 100.000.</p></section>`}
function start(){state.name=document.getElementById("name").value.trim()||"Jogador";state.profession=document.getElementById("profession").value.trim()||"Profissional";state.path=document.getElementById("path").value;state.city=document.getElementById("city").value.trim()||"Sua cidade";state.last="Você começou uma nova vida aos 18 anos.";addLog(state.last);save();render()}
function render(){
 if(!state.name){setup();return}
 let e=eventForToday();
 let progress=Math.round((state.day/30)*100);
 document.getElementById("app").innerHTML=`
 <section class="card"><div class="kicker">ANO ${Math.floor((state.age-18)/1)+1} • MÊS ${state.month} • DIA ${state.day}/30</div><h2 class="title">${fmtDate()}</h2>
 <div class="chips"><span class="chip">💼 ${state.profession}</span><span class="chip">📍 ${state.city}</span><span class="chip">⏰ ${String(7+Math.floor((7-state.time))).padStart(2,"0")}:00</span></div>
 <div class="grid">
 <div class="stat"><small>💰 Caixa</small><b>${money(state.cash)}</b></div><div class="stat"><small>📈 Patrimônio líquido</small><b>${money(net())}</b></div>
 <div class="stat"><small>❤️ Saúde</small><b>${Math.round(state.health)}%</b></div><div class="stat"><small>⚡ Energia</small><b>${Math.round(state.energy)}%</b></div>
 <div class="stat"><small>😊 Felicidade</small><b>${Math.round(state.happy)}%</b></div><div class="stat"><small>🧠 Estresse</small><b>${Math.round(state.stress)}%</b></div>
 <div class="stat"><small>📚 Conhecimento</small><b>${state.knowledge}</b></div><div class="stat"><small>💼 Experiência</small><b>${state.experience}</b></div>
 <div class="stat"><small>💳 Dívida</small><b>${money(state.debt)}</b></div><div class="stat"><small>🏦 Investimentos</small><b>${money(state.invest)}</b></div>
 </div><p class="tiny" style="margin-top:15px">Tempo disponível hoje: <b>${state.time} horas</b> • Renda mensal estimada: <b>${money(monthlyIncome())}</b></p>
 <div class="progress"><i style="width:${progress}%"></i></div><p class="tiny">Progresso do mês: ${progress}%</p></section>
 <section class="card event"><div class="kicker">ACONTECEU AGORA</div><h2 class="title">${e.title}</h2><p class="sub">${e.text}</p>
 ${e.choices.map((c,i)=>`<button class="choice" onclick="doEvent(${i})" ${state.eventDone?"disabled":""}><strong>${c[0]}</strong><span class="tiny">${i===0?"Uma escolha com consequência real.":i===1?"Uma alternativa mais equilibrada.":"Você preserva recursos, mas pode perder algo."}</span></button>`).join("")}
 ${state.eventDone?`<p class="good"><b>Decisão registrada.</b> O mundo continua se movendo.</p>`:""}
 </section>
 <section class="card"><div class="kicker">AGENDA DE HOJE</div><h2 class="title">${state.time>0?"Monte seu dia":"Seu tempo acabou"}</h2>
 <div class="action"><h3>🎓 Estudar</h3><p>2 horas • conhecimento +4 • abre oportunidades.</p><button onclick="doStudy()" ${state.time<2?"disabled":""}>ESTUDAR AGORA</button></div>
 <div class="action"><h3>💼 Trabalhar</h3><p>${archetypes[state.path]?.work||4} horas • gera renda e experiência.</p><button onclick="doWork()" ${state.time<1?"disabled":""}>IR TRABALHAR</button></div>
 <div class="action"><h3>🏃 Cuidar da saúde</h3><p>1 hora • saúde +5 • felicidade +4.</p><button onclick="doExercise()" ${state.time<1?"disabled":""}>CUIDAR DA SAÚDE</button></div>
 <div class="action"><h3>❤️ Vida pessoal</h3><p>2 horas • custa pouco • reduz estresse.</p><button onclick="doSocial()" ${state.time<2?"disabled":""}>VIVER UM POUCO</button></div>
 <div class="action"><h3>💰 Organizar dinheiro</h3><p>1 hora • orçamento • pequena economia.</p><button onclick="doMoney()" ${state.time<1?"disabled":""}>ORGANIZAR</button></div>
 <button class="secondary" onclick="doSleep()">🌙 ENCERRAR O DIA E DORMIR</button>
 </section>
 <section class="card"><div class="kicker">HISTÓRIA DA SUA VIDA</div>${state.logs.length?state.logs.map(x=>`<div class="log ${x.cls||""}">• ${x.d} — ${x.t}</div>`).join(""):"<p class=sub>Nenhum acontecimento registrado ainda.</p>"}</section>
 <section class="card"><button class="danger" onclick="restart()">RECOMEÇAR DO ZERO</button></section>
 ${state.gameOver?`<div class="card event"><h2 class="title">GAME OVER</h2><p class="sub">Sua dívida atingiu R$ 100.000. A vida financeira saiu do controle. Você pode recomeçar e tentar outra estratégia.</p></div>`:""}`;
}
load();render();
</script></body></html>
